name: Construire Pere Mehdi Cine (EXE + APK)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependances
        run: |
          pip install -r requirements.txt pyinstaller pillow
      - name: Construire l'EXE
        run: |
          flet pack main.py --name "PereMehdiCine" --product-name "Pere Mehdi Cine" --file-description "Films series football gratuits" --product-version 1.0.0 -y
      - uses: actions/upload-artifact@v4
        with:
          name: PereMehdiCine-Windows
          path: dist/PereMehdiCine.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2
          channel: stable
      - name: Dependances
        run: pip install "flet[all]==0.28.3"
      - name: Construire l'APK
        env:
          PYTHONIOENCODING: utf-8
        run: |
          flet build apk --project "PereMehdiCine" --product "Père Mehdi Ciné" --org km.peremehdi --build-version 1.0.0 -v
      - uses: actions/upload-artifact@v4
        with:
          name: PereMehdiCine-Android
          path: build/apk/*.apk
